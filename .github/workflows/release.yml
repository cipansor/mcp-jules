name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # A release must not ship a tag and a package.json version that disagree:
      # npm would publish one version while the GitHub release and its notes point
      # at another. Fail before anything is built or published.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "Tag $tag matches package.json version $version."

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Pack release artifact
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: mcp-jules-*.tgz
          generate_release_notes: true
          make_latest: true

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Trusted Publishing: npm exchanges this job's OIDC token for a short-lived
    # publish credential, so no long-lived npm token is stored in the repo.
    # Configure the publisher on npmjs.com for this repo and workflow first.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0. That is
      # newer than the npm bundled with some Node releases, and an older npm
      # fails the publish with an authentication error instead of falling back,
      # so pin the floor explicitly rather than relying on the bundled version.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
